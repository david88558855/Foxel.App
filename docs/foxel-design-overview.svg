<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1000" viewBox="0 0 680 1000" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F4FF"/>
    </linearGradient>
  </defs>
  <rect width="680" height="1000" fill="#F7F9FC"/>

  <!-- Hero -->
  <rect x="24" y="24" width="632" height="118" rx="24" fill="url(#hero)" stroke="#E7ECF2"/>
  <rect x="48" y="48" width="128" height="24" rx="12" fill="#EAF0FF"/>
  <text x="112" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#4C6FFF">v1.0 · 设计定稿</text>
  <text x="48" y="98" font-size="24" font-weight="800" fill="#16202C">Foxel 账户体系设计规范</text>
  <text x="48" y="122" font-size="13" fill="#5C6B7A">多账户隔离的私有云盘客户端 · Android / iOS / Windows / macOS / Linux</text>

  <!-- 色板 -->
  <text x="24" y="176" font-size="15" font-weight="800" fill="#16202C">配色</text>
  <g>
    <rect x="24" y="190" width="96" height="64" rx="14" fill="#4C6FFF"/>
    <text x="72" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">主色</text>
    <text x="72" y="240" text-anchor="middle" font-size="10" fill="#DCE5FF">#4C6FFF</text>

    <rect x="130" y="190" width="96" height="64" rx="14" fill="#F4F7FA" stroke="#E7ECF2"/>
    <text x="178" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#16202C">背景</text>
    <text x="178" y="240" text-anchor="middle" font-size="10" fill="#93A0AF">#F4F7FA</text>

    <rect x="236" y="190" width="96" height="64" rx="14" fill="#FFFFFF" stroke="#E7ECF2"/>
    <text x="284" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#16202C">卡片 / 描边</text>
    <text x="284" y="240" text-anchor="middle" font-size="10" fill="#93A0AF">#FFFFFF / #E7ECF2</text>

    <rect x="342" y="190" width="96" height="64" rx="14" fill="#12B886"/>
    <text x="390" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">成功</text>
    <text x="390" y="240" text-anchor="middle" font-size="10" fill="#D6F5EA">#12B886</text>

    <rect x="448" y="190" width="96" height="64" rx="14" fill="#F59E0B"/>
    <text x="496" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">警告</text>
    <text x="496" y="240" text-anchor="middle" font-size="10" fill="#FFEBC7">#F59E0B</text>

    <rect x="554" y="190" width="102" height="64" rx="14" fill="#E5484D"/>
    <text x="605" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">危险</text>
    <text x="605" y="240" text-anchor="middle" font-size="10" fill="#FBD5D6">#E5484D</text>
  </g>
  <g>
    <rect x="24" y="266" width="632" height="46" rx="12" fill="#FFFFFF" stroke="#E7ECF2"/>
    <text x="42" y="294" font-size="12" font-weight="700" fill="#16202C">文字层级</text>
    <text x="120" y="294" font-size="13" font-weight="800" fill="#16202C">一级 #16202C</text>
    <text x="250" y="294" font-size="12" font-weight="600" fill="#5C6B7A">二级 #5C6B7A</text>
    <text x="380" y="294" font-size="11.5" font-weight="600" fill="#93A0AF">三级 #93A0AF</text>
    <text x="540" y="294" font-size="11.5" fill="#93A0AF">账户主题色 · 选中态</text>
  </g>

  <!-- 圆角与字号 -->
  <text x="24" y="348" font-size="15" font-weight="800" fill="#16202C">圆角与字号</text>
  <g>
    <rect x="24" y="362" width="200" height="96" rx="20" fill="#FFFFFF" stroke="#E7ECF2"/>
    <text x="124" y="388" text-anchor="middle" font-size="12" font-weight="800" fill="#16202C">圆角</text>
    <text x="40" y="412" font-size="11.5" fill="#5C6B7A">卡片 20 · 瓦片/按钮 16</text>
    <text x="40" y="432" font-size="11.5" fill="#5C6B7A">字段 14 · 导航 22 · 选中段 15</text>
    <text x="40" y="452" font-size="11.5" fill="#5C6B7A">头像 15/13/20 · 胶囊 99</text>

    <rect x="240" y="362" width="416" height="96" rx="20" fill="#FFFFFF" stroke="#E7ECF2"/>
    <text x="258" y="388" font-size="12" font-weight="800" fill="#16202C">字号字重</text>
    <text x="258" y="412" font-size="17" font-weight="800" fill="#16202C">页面标题 21 w800</text>
    <text x="258" y="432" font-size="13" font-weight="800" fill="#93A0AF">分组标题 12 w800</text>
    <text x="258" y="452" font-size="14" font-weight="700" fill="#16202C">列表标题 14.5 w700 · 副标题 12 w600</text>
  </g>

  <!-- 页面地图 -->
  <text x="24" y="500" font-size="15" font-weight="800" fill="#16202C">页面地图（设计稿 9 页）</text>
  <g>
    <rect x="24" y="516" width="200" height="60" rx="16" fill="#FFFFFF" stroke="#E7ECF2"/>
    <text x="40" y="540" font-size="12.5" font-weight="800" fill="#4C6FFF">① 概览与规范</text>
    <text x="40" y="560" font-size="11" fill="#5C6B7A">设计令牌 · 导航流向</text>

    <rect x="240" y="516" width="200" height="60" rx="16" fill="#FFFFFF" stroke="#E7ECF2"/>
    <text x="256" y="540" font-size="12.5" font-weight="800" fill="#4C6FFF">② 账户管理页</text>
    <text x="256" y="560" font-size="11" fill="#5C6B7A">切换 · 多选删除</text>

    <rect x="456" y="516" width="200" height="60" rx="16" fill="#FFFFFF" stroke="#E7ECF2"/>
    <text x="472" y="540" font-size="12.5" font-weight="800" fill="#4C6FFF">③ 空态与添加账户</text>
    <text x="472" y="560" font-size="11" fill="#5C6B7A">唯一空态 · 手动 / 扫码</text>

    <rect x="24" y="588" width="200" height="60" rx="16" fill="#FFFFFF" stroke="#E7ECF2"/>
    <text x="40" y="612" font-size="12.5" font-weight="800" fill="#4C6FFF">④ 编辑账户</text>
    <text x="40" y="632" font-size="11" fill="#5C6B7A">基本信息 · 隔离开关</text>

    <rect x="240" y="588" width="200" height="60" rx="16" fill="#FFFFFF" stroke="#E7ECF2"/>
    <text x="256" y="612" font-size="12.5" font-weight="800" fill="#4C6FFF">⑤ 设置页</text>
    <text x="256" y="632" font-size="11" fill="#5C6B7A">下载目录 · 存储用量</text>

    <rect x="456" y="588" width="200" height="60" rx="16" fill="#FFFFFF" stroke="#E7ECF2"/>
    <text x="472" y="612" font-size="12.5" font-weight="800" fill="#4C6FFF">⑥ 主界面与导航</text>
    <text x="472" y="632" font-size="11" fill="#5C6B7A">尺寸 · 间距 · 阴影规范</text>

    <rect x="24" y="660" width="200" height="60" rx="16" fill="#FFFFFF" stroke="#E7ECF2"/>
    <text x="40" y="684" font-size="12.5" font-weight="800" fill="#4C6FFF">⑦ 隔离与存储</text>
    <text x="40" y="704" font-size="11" fill="#5C6B7A">五类数据分区</text>

    <rect x="240" y="660" width="200" height="60" rx="16" fill="#FFFFFF" stroke="#E7ECF2"/>
    <text x="256" y="684" font-size="12.5" font-weight="800" fill="#4C6FFF">⑧ 异常与确认</text>
    <text x="256" y="704" font-size="11" fill="#5C6B7A">失效 · 切换中 · 删除确认</text>

    <rect x="456" y="660" width="200" height="60" rx="16" fill="#FFFFFF" stroke="#E7ECF2"/>
    <text x="472" y="684" font-size="12.5" font-weight="800" fill="#4C6FFF">⑨ 范围与规划</text>
    <text x="472" y="704" font-size="11" fill="#5C6B7A">已落地能力 · 后续规划</text>
  </g>

  <!-- 底部导航规范 -->
  <text x="24" y="760" font-size="15" font-weight="800" fill="#16202C">底部浮动导航规范</text>
  <rect x="24" y="776" width="632" height="150" rx="20" fill="#FFFFFF" stroke="#E7ECF2"/>
  <text x="48" y="806" font-size="12" font-weight="700" fill="#16202C">胶囊高 74（内边距 6 + 内容 62）· 左右边距 16 · 距底部 ≥12</text>
  <text x="48" y="830" font-size="12" font-weight="700" fill="#16202C">分段宽 =（宽 − 12）/ 3 · 段间距 14 · 选中段圆角 15 · 胶囊圆角 22</text>
  <text x="48" y="854" font-size="12" font-weight="700" fill="#16202C">图标 20px · 标签 10.5 w800 · 描边 1px #E7ECF2</text>
  <text x="48" y="878" font-size="12" font-weight="700" fill="#16202C">阴影 blur 14 / offset (0,6) / 10% #8B97AA（不遮系统导航区）</text>
  <g>
    <rect x="48" y="892" width="584" height="22" rx="8" fill="#F7F9FC"/>
    <text x="60" y="907" font-size="11" fill="#93A0AF">按下反馈只保留选中胶囊动画，禁用 splash / highlight（避免出现比胶囊更大的高亮块）</text>
  </g>

  <text x="24" y="962" font-size="11.5" fill="#93A0AF">完整可交互设计稿：foxel-account-design.html（9 页签可切换）</text>
  <text x="24" y="982" font-size="11.5" fill="#93A0AF">设计令牌实现：lib/core/theme/design_tokens.dart</text>
</svg>
