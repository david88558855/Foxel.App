name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如: 1.0.0)'
        required: true
        type: string
      prerelease:
        description: '标记为预发布版本'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set. APK will use debug signing."
            exit 0
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android signing secrets are incomplete. APK will use debug signing."
            exit 0
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/foxel-release.jks
          {
            printf 'storeFile=foxel-release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build ABI split APKs
        run: bash scripts/build_android_split_apk.sh

      - name: Rename APKs with version
        run: |
          VERSION="${{ inputs.version }}"
          cd build/app/outputs/flutter-apk
          cp app-armeabi-v7a-release.apk foxel-${VERSION}-android-armeabi-v7a.apk
          cp app-arm64-v8a-release.apk foxel-${VERSION}-android-arm64-v8a.apk
          cp app-x86_64-release.apk foxel-${VERSION}-android-x86_64.apk

      - name: Upload Android APKs
        uses: actions/upload-artifact@v7
        with:
          name: foxel-android-apks
          path: |
            build/app/outputs/flutter-apk/foxel-*-android-*.apk
          if-no-files-found: error

  build-linux:
    name: Linux App
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libmpv-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux bundle
        run: |
          VERSION="${{ inputs.version }}"
          cd build/linux/x64/release/bundle
          tar -czf ../../../foxel-${VERSION}-linux-x86_64.tar.gz .
          mv ../../../foxel-${VERSION}-linux-x86_64.tar.gz $GITHUB_WORKSPACE/

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v7
        with:
          name: foxel-linux-bundle
          path: foxel-${{ inputs.version }}-linux-x86_64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Windows App
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows bundle
        shell: pwsh
        run: |
          $VERSION = "${{ inputs.version }}"
          $sourcePath = "build/windows/x64/runner/Release"
          $zipName = "foxel-$VERSION-windows-x86_64.zip"
          Compress-Archive -Path "$sourcePath\*" -DestinationPath $zipName

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v7
        with:
          name: foxel-windows-bundle
          path: foxel-${{ inputs.version }}-windows-x86_64.zip
          if-no-files-found: error

  build-macos:
    name: macOS App
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS bundle
        run: |
          VERSION="${{ inputs.version }}"
          cd build/macos/Build/Products/Release
          zip -r $GITHUB_WORKSPACE/foxel-${VERSION}-macos-arm64.zip Foxel.app

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v7
        with:
          name: foxel-macos-bundle
          path: foxel-${{ inputs.version }}-macos-arm64.zip
          if-no-files-found: error

  build-ios:
    name: iOS App (unsigned)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          VERSION="${{ inputs.version }}"
          mkdir -p build/ios/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -r foxel-${VERSION}-ios-arm64.ipa Payload
          mv foxel-${VERSION}-ios-arm64.ipa $GITHUB_WORKSPACE/

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: foxel-ios-unsigned-ipa
          path: foxel-${{ inputs.version }}-ios-arm64.ipa
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-android, build-linux, build-windows, build-macos, build-ios]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Foxel v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            ## Foxel v${{ inputs.version }}

            请根据操作系统和 CPU 架构选择安装包。

            | 架构 | Windows | macOS | Linux | Android | iOS |
            |------|---------|-------|-------|---------|-----|
            | x86-64 (64 位) | [ZIP](https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/foxel-${{ inputs.version }}-windows-x86_64.zip) | — | [TAR.GZ](https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/foxel-${{ inputs.version }}-linux-x86_64.tar.gz) | [APK](https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/foxel-${{ inputs.version }}-android-x86_64.apk) | — |
            | AArch64 / ARM64 | — | [ZIP](https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/foxel-${{ inputs.version }}-macos-arm64.zip) | — | [APK](https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/foxel-${{ inputs.version }}-android-arm64-v8a.apk) | [IPA](https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/foxel-${{ inputs.version }}-ios-arm64.ipa) |
            | ARMv7 (32 位) | — | — | — | [APK](https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/foxel-${{ inputs.version }}-android-armeabi-v7a.apk) | — |

            ### 安装说明

            - **Windows**: 下载 ZIP 压缩包，解压后运行 `foxel.exe`
            - **macOS**: 下载 ZIP 压缩包，解压后拖入「应用程序」文件夹；首次打开可能需要在「系统设置 > 隐私与安全性」中允许
            - **Linux**: 下载 TAR.GZ 压缩包，解压后运行 `foxel`
            - **Android**: 下载对应架构的 APK 文件安装；大多数现代设备选择 `arm64-v8a`
            - **iOS**: 下载 IPA 文件，需通过 AltStore 等工具侧载安装（未签名版本）
          files: |
            artifacts/foxel-*-android-*.apk
            artifacts/foxel-*-linux-*.tar.gz
            artifacts/foxel-*-windows-*.zip
            artifacts/foxel-*-macos-*.zip
            artifacts/foxel-*-ios-*.ipa